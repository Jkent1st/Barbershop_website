<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Off The Top Barber Shop – Barbers and braids in Corona, NY</title>
<meta name="description" content="Off The Top Barber Shop in Corona, NY. Barbers and braids, appointments and walk-ins, open 7 days.">
<meta property="og:title" content="Off The Top Barber Shop">
<meta property="og:description" content="Barbers and braids in Corona, NY. Open 7 days.">
<meta property="og:type" content="website">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💈%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#09090d;--card:#14141b;--line:rgba(255,255,255,.12);--txt:#f4f4f7;--mute:#a9a9b8;--p:#a24dff;--chrome:#d8dbe4;--d:'Anton','Impact','Arial Narrow',sans-serif;--b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px;background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--txt);font:400 1.05rem/1.65 var(--b);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0;text-transform:uppercase;letter-spacing:.02em;line-height:1}
h2{font-size:clamp(2.4rem,6vw,4rem)}
h3{font-size:1.5rem}
h2,.hero h1 span:nth-child(2) i{background:linear-gradient(180deg,#fff 0%,#d8dbe4 44%,#8c91a3 52%,#eceef4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
h2{filter:drop-shadow(0 0 18px rgba(162,77,255,.35))}
.hero h1 span:first-child i{text-shadow:0 0 30px rgba(162,77,255,.6)}
.dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:.6rem;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom,0px));background:rgba(9,9,13,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .btn{flex:1;padding:.8rem .4rem;font-size:.82rem}
@media(max-width:760px){.dock{display:flex}body{padding-bottom:72px}}
p{margin:0}
section{padding:5.5rem 0}
.lead{color:var(--mute);max-width:58ch}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.9rem 1.6rem;border:1.5px solid var(--chrome);border-radius:3px;font:700 .92rem var(--b);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;background:none;color:var(--txt);transition:background .2s,color .2s,transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:#fff;border-color:#fff;color:var(--ink)}
.btn.sec:hover{background:var(--chrome);color:var(--ink)}
[hidden]{display:none!important}
header{position:fixed;inset:0 0 auto 0;z-index:50;border-bottom:1px solid transparent;transition:background .3s,border-color .3s;padding-top:env(safe-area-inset-top,0px)}
header.solid{background:rgba(9,9,13,.9);backdrop-filter:blur(12px);border-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;font:400 1.3rem var(--d);letter-spacing:.06em;text-transform:uppercase}
.logo img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
nav ul{display:flex;gap:1.8rem;list-style:none;margin:0;padding:0;align-items:center}
nav a:not(.btn){text-decoration:none;font-weight:500;font-size:.95rem;color:#e6e6ee}
nav a:not(.btn):hover{color:var(--p)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--txt);width:44px;height:44px;border-radius:3px;cursor:pointer}
.burger span,.burger span::before,.burger span::after{display:block;width:20px;height:2px;background:currentColor;margin:auto;position:relative;transition:transform .25s,background .25s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded=true] span{background:transparent}
.burger[aria-expanded=true] span::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded=true] span::after{transform:translateY(-6px) rotate(-45deg)}
@media(max-width:860px){.burger{display:block}
nav{position:fixed;inset:68px 0 auto 0;background:var(--ink);border-bottom:1px solid var(--line);padding:1rem 1.25rem 1.5rem;display:none}
nav.open{display:block}nav ul{flex-direction:column;align-items:stretch;gap:0}
nav li a:not(.btn){display:block;padding:.9rem 0;border-bottom:1px solid var(--line);font-size:1.1rem}
nav li:last-child{margin-top:1rem}nav .btn{width:100%}}
.hero{min-height:100svh;display:flex;align-items:center;padding:7rem 0 4rem;background:radial-gradient(60% 55% at 78% 35%,rgba(162,77,255,.28),transparent 70%),radial-gradient(50% 40% at 10% 100%,rgba(162,77,255,.14),transparent 70%),var(--ink)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:3rem;align-items:center}
.eyebrow{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;color:var(--p);margin-bottom:1.2rem}
.hero h1{font-size:clamp(3.6rem,10vw,7.6rem)}
.hero h1 span{display:block;overflow:hidden}
.hero h1 i{display:block;font-style:normal;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span:nth-child(2) i{animation-delay:.12s;color:var(--chrome)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero .lead{margin:1.5rem 0 2rem;font-size:1.15rem}
.cta{display:flex;flex-wrap:wrap;gap:.9rem}
.pics{position:relative;height:430px}
.pics img{position:absolute;width:240px;aspect-ratio:7/8;object-fit:cover;border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.6);border-radius:4px}
.pics img:nth-child(1){left:6%;top:0;transform:rotate(-5deg)}
.pics img:nth-child(2){right:0;bottom:0;transform:rotate(4deg)}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.pics{height:300px}.pics img{width:170px}}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:2.5rem}
.card{background:var(--card);padding:2rem 1.5rem;transition:background .25s}
.card:hover{background:#1b1b26}
.card svg{width:38px;height:38px;stroke:var(--p);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:1.1rem}
.card p{color:var(--mute);font-size:.97rem;margin-top:.5rem}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.stage{--cw:clamp(170px,22vw,260px);background:#f2f0ea;color:#111;overflow:hidden}
.stage h2,.stage h3{color:#111;-webkit-text-fill-color:#111;background:none;filter:none}.stage .lead{color:#55535a}
.stage .btn.sec{border-color:#111;color:#111}.stage .btn.sec:hover{background:#111;color:#fff}
.arc{position:relative;height:clamp(340px,52vw,470px);margin-top:2rem;perspective:1400px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.arc.drag{cursor:grabbing}
.arc .c{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:7/8;margin:0;padding:0;border:0;background:#ddd;box-shadow:0 24px 50px rgba(30,25,20,.28);will-change:transform,opacity;cursor:inherit}
.arc .c img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;margin-top:2rem;padding-top:1.2rem;border-top:1px solid rgba(0,0,0,.15)}
.meta .n{font:700 .85rem var(--b);letter-spacing:.16em;color:#6b6872}
.meta h3{font-size:clamp(1.8rem,4vw,2.8rem);margin-top:.3rem}
.stars{color:#c98a00;letter-spacing:.12em;font-size:1.1rem;margin-top:.4rem}
.nb{display:flex;gap:.5rem}
.nb button{width:44px;height:44px;border:1px solid rgba(0,0,0,.25);background:none;color:#111;cursor:pointer;font-size:1.1rem;border-radius:3px}
.nb button:hover{background:#111;color:#fff}
.dots{display:flex;gap:.7rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap}
.dots button{position:relative;width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(0,0,0,.22);cursor:pointer;transition:background .2s,transform .2s}
.dots button::after{content:"";position:absolute;inset:-10px}
.dots button[aria-current=true]{background:#111;transform:scale(1.4)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(4,4,8,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:1.5rem}
.lb.open{display:flex}
.lb img{max-width:min(560px,100%);max-height:72vh;border:1px solid var(--line)}
.lb .btn{position:absolute;top:1rem;right:1rem}
.band{background:var(--card);border-block:1px solid var(--line)}
.hire{display:grid;grid-template-columns:1fr 280px;gap:3rem;align-items:center}
.hire img{width:100%;border:1px solid var(--line);border-radius:4px}
.hire .lead{margin:1.2rem 0 1.8rem}
@media(max-width:760px){.hire{grid-template-columns:1fr}.hire img{max-width:280px}}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.visit dl{margin:1.8rem 0 0;display:grid;gap:1.2rem}
.visit dt{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--p)}
.visit dd{margin:.2rem 0 0;color:#dcdce6}
.visit .cta{margin-top:2rem}
.panel{border:1px solid var(--line);background:var(--card);padding:2.2rem;align-self:start}
.panel ul{margin:1rem 0 0;padding:0;list-style:none;color:var(--mute);display:grid;gap:.5rem}
@media(max-width:760px){.visit{grid-template-columns:1fr;gap:2rem}}
footer{border-top:1px solid var(--line);padding:2.5rem 0;color:var(--mute);font-size:.92rem}
.fr{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.top{background:none;border:1px solid var(--line);color:var(--txt);padding:.4rem .9rem;border-radius:3px;cursor:pointer}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header id="top"><div class="wrap bar">
<a class="logo" href="#home" aria-label="Off The Top Barber Shop home"><img id="logoImg" alt="" width="42" height="42"><span>Off The Top</span></a>
<button class="burger" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span></button>
<nav id="nav" aria-label="Main"><ul>
<li><a href="#home">Home</a></li><li><a href="#services">Services</a></li><li><a href="#gallery">Gallery</a></li><li id="navHire"><a href="#join">Join us</a></li><li><a href="#visit">Visit</a></li>
<li><a class="btn pri" data-book href="#"></a></li></ul></nav>
</div></header>

<main>
<section class="hero" id="home"><div class="wrap">
<div>
<h1 aria-label="Fresh cuts. Clean braids."><span><i>Fresh cuts.</i></span><span><i>Clean braids.</i></span></h1>
<p class="lead" id="heroText"></p>
<div class="cta"><a class="btn pri" data-book href="#"></a><a class="btn sec" data-maps href="#">Get directions</a></div>
</div>
<div class="pics" aria-hidden="true"><img id="h1img" alt=""><img id="h2img" alt=""></div>
</div></section>

<section id="services"><div class="wrap rv">
<h2>What we do</h2>
<div class="cards" id="cards"></div>
</div></section>

<section id="gallery" class="stage"><div class="wrap rv">
<h2>The work</h2>
<div class="arc" id="arc" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Photo gallery"></div>
<div class="meta"><div><div class="n" id="gN"></div><h3 id="gT"></h3><div class="stars" id="gR" hidden></div></div><div class="nb"><button id="gPrev" aria-label="Previous photo">←</button><button id="gNext" aria-label="Next photo">→</button></div></div>
<div class="dots" id="dots"></div>
<p style="text-align:center;margin-top:2rem"><a class="btn sec" data-ig href="#" target="_blank" rel="noopener noreferrer">More on Instagram</a></p>
</div></section>

<section id="join"><div class="wrap hire rv">
<div><h2 id="hireTitle"></h2><p class="lead" id="hireText"></p><a class="btn pri" data-ig href="#" target="_blank" rel="noopener noreferrer">Message us on Instagram</a></div>
<img id="hireImg" alt="Flyer: we’re looking for another barber, one spot available">
</div></section>

<section id="visit" class="band"><div class="wrap visit rv">
<div>
<h2>Come through</h2>
<dl><div><dt>Address</dt><dd id="addr"></dd></div><div><dt>When</dt><dd id="openLine"></dd></div><div id="phoneRow" hidden><dt>Phone</dt><dd><a id="phoneA" href="#"></a></dd></div></dl>
<div class="cta"><a class="btn pri" data-maps href="#">Get directions</a><a class="btn sec" data-ig href="#" target="_blank" rel="noopener noreferrer">Instagram</a></div>
</div>
<div class="panel" id="hoursPanel" hidden><h3>Hours</h3><ul id="hours"></ul></div>
</div></section>
</main>

<footer><div class="wrap fr"><span id="copy"></span><span><a data-ig href="#" target="_blank" rel="noopener noreferrer">@offthetop.barbershop</a></span><button class="top" id="toTop">Back to top</button></div></footer>

<div class="dock" id="dock"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="btn sec" id="lbClose">Close</button><img id="lbImg" alt=""><p id="lbCap" class="lead"></p></div>

  address: "43-01 National St, Corona, NY 11368",
  openLine: "Open 7 days · Appointments + walk-ins",
  links: {
    instagram: "https://www.instagram.com/offthetop.barbershop/",
    maps: "https://www.google.com/maps/place/Off+The+Top+Barber+Shop/data=!4m7!3m6!1s0x89c25f4a1f52f8f5:0xf576a4393f436a1a!8m2!3d40.746714!4d-73.863549!16s%2Fg%2F11k1369p5m!19sChIJ9fhSH0pfwokRGmpDPzmkdvU",
    booking: "",  // optional: online booking link
    phone: ""     // optional: e.g. "+17185551234"
  },
  hours: [],      // optional, e.g. ["Mon–Fri: 10am–8pm", "Sat: 9am–8pm"]
  services: [
    { icon: "scissors", title: "Haircuts and fades", text: "Clean fades and classic cuts." },
    { icon: "beard", title: "Beard trims", text: "Shaped and finished sharp." },
    { icon: "spark", title: "Hair designs", text: "Lines and custom designs." },
    { icon: "braid", title: "Braids", text: "Cornrows and braided styles." }
  ],
  gallery: [ // optional per photo: rating (0 to 5). Leave it out and no stars show.
    { img: "t5", cap: "Fade with line design" }, { img: "t1", cap: "Braided pattern" },
    { img: "t6", cap: "Fade with a custom design" }, { img: "t3", cap: "Cornrows with a clean fade" },
    { img: "t7", cap: "Haircut and beard" }, { img: "t4", cap: "Long braids" },
    { img: "t8", cap: "Inside the shop" }
  ],
  hiring: { show: true, title: "Join the team", text: "We’re looking for another barber, and there is one spot available. Send us a message on Instagram to ask about it." }
};

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const L = CONFIG.links;
const ICON = {
  scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/>',
  beard: '<path d="M5 6c0 8 2 13 7 13s7-5 7-13"/><path d="M9 13c1 1 5 1 6 0"/>',
  spark: '<path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6z"/>',
  braid: '<path d="M8 3c4 3-4 5 0 9s-4 5 0 9M16 3c-4 3 4 5 0 9s4 5 0 9"/>'
};
document.title = CONFIG.name + " – Barbers and braids in Corona, NY";
$('#logoImg').src = IMG.logo; $('#h1img').src = IMG.t7; $('#h2img').src = IMG.t5; $('#hireImg').src = IMG.flyer;
$('#heroText').textContent = "Barbers and braids in Corona, NY. Appointments and walk-ins, open 7 days.";
$('#addr').textContent = CONFIG.address; $('#openLine').textContent = CONFIG.openLine;
$('#cards').innerHTML = CONFIG.services.map(s => `<article class="card"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[s.icon]}</svg><h3>${s.title}</h3><p>${s.text}</p></article>`).join('');
initCarousel();
if (CONFIG.hiring.show) { $('#hireTitle').textContent = CONFIG.hiring.title; $('#hireText').textContent = CONFIG.hiring.text; } else { $('#join').hidden = true; $('#navHire').hidden = true; }
if (CONFIG.hours.length) { $('#hoursPanel').hidden = false; $('#hours').innerHTML = CONFIG.hours.map(h => `<li>${h}</li>`).join(''); }
if (L.phone) { $('#phoneRow').hidden = false; $('#phoneA').href = 'tel:' + L.phone; $('#phoneA').textContent = L.phone; }
$$('[data-book]').forEach(a => { a.href = L.booking || L.instagram; a.textContent = L.booking ? 'Book now' : 'Message us'; a.target = '_blank'; a.rel = 'noopener noreferrer'; });
$$('[data-maps]').forEach(a => { a.href = L.maps; a.target = '_blank'; a.rel = 'noopener noreferrer'; });
$$('[data-ig]').forEach(a => a.href = L.instagram);
$('#dock').innerHTML = [L.booking && ['Book now', L.booking], ['Message', L.instagram], L.phone && ['Call', 'tel:' + L.phone], ['Directions', L.maps]].filter(Boolean)
  .map((x, i) => `<a class="btn ${i ? 'sec' : 'pri'}" href="${x[1]}"${x[1].startsWith('tel:') ? '' : ' target="_blank" rel="noopener noreferrer"'}>${x[0]}</a>`).join('');
$('#copy').textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;

const hd = $('header'), bg = $('.burger'), nav = $('#nav');
const setMenu = o => { nav.classList.toggle('open', o); bg.setAttribute('aria-expanded', o); bg.setAttribute('aria-label', o ? 'Close menu' : 'Open menu'); };
bg.onclick = () => setMenu(!nav.classList.contains('open'));
nav.onclick = e => { if (e.target.closest('a')) setMenu(false); };
const onScroll = () => hd.classList.toggle('solid', scrollY > 40); onScroll(); addEventListener('scroll', onScroll, { passive: true });
$('#toTop').onclick = () => scrollTo({ top: 0 });

const lb = $('#lb'); let last;
function openLb(i, el) { last = el; const g = CONFIG.gallery[i];
  $('#lbImg').src = IMG[g.img]; $('#lbImg').alt = g.cap; $('#lbCap').textContent = g.cap; lb.classList.add('open'); $('#lbClose').focus(); }

/* Infinite concave-arc carousel: drag, swipe, click, arrow keys; snaps to the nearest card. */
function initCarousel() {
  const arc = $('#arc'), items = CONFIG.gallery, N = items.length, RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cards = items.map(g => { const b = document.createElement('button'); b.type = 'button'; b.className = 'c'; b.tabIndex = -1; b.setAttribute('aria-label', g.cap);
    b.innerHTML = `<img src="${IMG[g.img]}" alt="${g.cap}" draggable="false">`; arc.appendChild(b); return b; });
  $('#dots').innerHTML = items.map((g, i) => `<button type="button" aria-label="Show photo ${i + 1}: ${g.cap}"></button>`).join('');
  const dots = [...$('#dots').children];
  let p = 0, raf = 0, front = -1;
  const wrapD = d => ((d + N / 2) % N + N) % N - N / 2;
  const unit = () => (cards[0].offsetWidth || 240) * .8;
  function render() {
    const cw = cards[0].offsetWidth || 240, R = cw * 2.6;
    cards.forEach((c, i) => {
      const d = wrapD(i - p), a = Math.abs(d), th = d * .3;
      const x = R * Math.sin(th), z = R * (1 - Math.cos(th)) * .8, s = 1 - .05 * Math.min(a, 3);
      const o = a > 3.2 ? 0 : Math.max(0, 1 - .3 * Math.max(0, a - 1.2));
      c.style.transform = `translate(-50%,-50%) translateX(${x}px) translateZ(${z}px) rotateY(${-th}rad) scale(${s})`;
      c.style.opacity = o; c.style.zIndex = 100 - Math.round(a * 10); c.style.pointerEvents = o ? 'auto' : 'none';
    });
    const f = ((Math.round(p) % N) + N) % N;
    if (f !== front) { front = f; const g = items[f];
      $('#gN').textContent = String(f + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0'); $('#gT').textContent = g.cap;
      const r = $('#gR'); if (g.rating) { const k = Math.round(g.rating); r.hidden = false; r.textContent = '★'.repeat(k) + '☆'.repeat(5 - k); r.setAttribute('aria-label', 'Rated ' + g.rating + ' out of 5'); } else r.hidden = true;
      dots.forEach((b, i) => b.setAttribute('aria-current', i === f)); }
  }
  function go(t) { cancelAnimationFrame(raf); if (RM) { p = t; render(); return; }
    const p0 = p, dt = t - p0, T = Math.min(700, 260 + Math.abs(dt) * 140), t0 = performance.now();
    (function step(n) { const k = Math.min(1, (n - t0) / T); p = p0 + dt * (1 - Math.pow(1 - k, 3)); render(); if (k < 1) raf = requestAnimationFrame(step); })(t0); }
  const to = i => Math.round(p) + Math.round(wrapD(i - Math.round(p)));
  let sx = 0, sp = 0, moved = 0, dragging = false, lx = 0, lt = 0, v = 0;
  arc.addEventListener('pointerdown', e => { if (e.button > 0) return; dragging = true; moved = 0; sx = lx = e.clientX; sp = p; lt = performance.now(); v = 0; cancelAnimationFrame(raf); arc.setPointerCapture(e.pointerId); arc.classList.add('drag'); });
  arc.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - sx, n = performance.now(); moved = Math.max(moved, Math.abs(dx)); p = sp - dx / unit();
    v = .8 * v + .2 * ((lx - e.clientX) / unit()) / Math.max(1, n - lt) * 1000; lx = e.clientX; lt = n; render(); });
  const end = e => { if (!dragging) return; dragging = false; arc.classList.remove('drag');
    if (moved < 6) { const c = document.elementFromPoint(e.clientX, e.clientY), i = cards.indexOf(c && c.closest('.c'));
      if (i >= 0 && Math.round(wrapD(i - p)) === 0) { openLb(i, cards[i]); go(Math.round(p)); } else if (i >= 0) go(to(i)); else go(Math.round(p)); }
    else go(Math.round(p + Math.max(-2, Math.min(2, v * .25)))); };
  arc.addEventListener('pointerup', end); arc.addEventListener('pointercancel', end);
  arc.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') { e.preventDefault(); go(Math.round(p) - 1); } else if (e.key === 'ArrowRight') { e.preventDefault(); go(Math.round(p) + 1); } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(front, arc); } });
  $('#gPrev').onclick = () => go(Math.round(p) - 1); $('#gNext').onclick = () => go(Math.round(p) + 1);
  dots.forEach((b, i) => b.onclick = () => go(to(i)));
  addEventListener('resize', render); render();
}
const closeLb = () => { lb.classList.remove('open'); last && last.focus(); };
$('#lbClose').onclick = closeLb; lb.onclick = e => { if (e.target === lb) closeLb(); };
addEventListener('keydown', e => { if (e.key === 'Escape') { setMenu(false); if (lb.classList.contains('open')) closeLb(); } });

const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
$$('.rv').forEach(el => io.observe(el));
</script>
</body>
</html>
